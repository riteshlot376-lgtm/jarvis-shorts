name: Jarvis Shorts Autopilot

on:
  schedule:
    - cron: '30 3,9 * * *' # सुबह 9:00 बजे और शाम 3:00 बजे (IST) अपने आप रन होगा
  workflow_dispatch: # इससे तुम जब चाहो तब बटन दबाकर खुद भी चला सकते हो

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-generativeai moviepy imageio-ffmpeg

    - name: Run Jarvis Autopilot Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      run: |
        python main.py
