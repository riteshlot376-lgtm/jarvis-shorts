name: Jarvis Shorts Autopilot

on:
  schedule:
    - cron: '30 3,9 * * *' # सुबह 9:30 और शाम 3:00 बजे का समय
  workflow_dispatch: # इससे तुम जब चाहो तब बटन दबाकर खुद भी चला सकते हो

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai moviepy imageio-ffmpeg

      - name: Run Jarvis Autopilot Script
        env:
          GEMINI_API_KEY: "AQ.Ab8RN6L4er2YVyRDjVK6zBhisHjtBI7MAFtwb8blGfrqLo2WgA"
          ELEVENLABS_API_KEY: "sk_f1916e0ae7ad6f9d6d62769fb8ce23517fd242a1aba6fae6"
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python main.py
